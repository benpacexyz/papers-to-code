[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "micrograd"
requires-python = ">=3.14,<3.15"
version = "0.1.0"
description = "implementation of micrograd"

# deployment dependencies
dependencies = [
    "ipython>=9.16.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.3",
]

# developer dependencies
[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
]

[tool.maturin]
manifest-path = "nn/Cargo.toml"
module-name = "rust_nn"
